[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-council"
version = "0.1.0"
description = "Offline XAUUSD research system (research/paper only; no live execution)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2.1",
  "pymupdf>=1.24",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gold-council = "gold_council.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
